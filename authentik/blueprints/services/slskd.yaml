version: 1
metadata:
  name: service - slskd
  labels:
    blueprints.goauthentik.io/description: "Slskd Access"

entries:
  # Use the common - admin blueprint
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: common - admin
      required: true

  # Create a Provider
  - model: authentik_providers_proxy.proxyprovider
    id: slskd-provider
    state: present
    identifiers:
      name: Slskd Provider
    attrs:
      mode: forward_single
      external_host: https://slskd.final.domain.name
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # Create an App
  - model: authentik_core.application
    id: slskd-app
    state: present
    identifiers:
      slug: slskd
    attrs:
      name: Slskd
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/slskd.png
      provider: !KeyOf slskd-provider
      meta_launch_url: https://slskd.final.domain.name
      policy_engine_mode: any
      group: Request

  # Rules : admins
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf slskd-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf slskd-app
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
    attrs:
      order: 20
