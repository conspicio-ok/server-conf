version: 1
metadata:
  name: service - droppedneedle
  labels:
    blueprints.goauthentik.io/description: "droppedneedle Access"

entries:
  # Use the common - admin blueprint
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: common - admin
      required: true

  # Create droppedneedle group
  - model: authentik_core.group
    id: droppedneedle-grp
    state: present
    identifiers:
      name: droppedneedle-users

  # Create a Provider
  - model: authentik_providers_oauth2.oauth2provider
    id: droppedneedle-provider
    state: present
    identifiers:
      name: droppedneedle Provider
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
      client_id: droppedneedle
      redirect_uris:
        - matching_mode: strict
          url: https://music.final.domain.name/api/v1/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # Create an App
  - model: authentik_core.application
    id: droppedneedle-app
    state: present
    identifiers:
      slug: droppedneedle
    attrs:
      name: Music
      meta_icon: https://raw.githubusercontent.com/droppedneedle/droppedneedle/master/resources/logo-192x192.png
      provider: !KeyOf droppedneedle-provider
      meta_launch_url: https://music.final.domain.name
      policy_engine_mode: any
      group: Media

  # Rules : droppedneedle-grp & admins
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf droppedneedle-app
      group: !KeyOf droppedneedle-grp
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf droppedneedle-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf droppedneedle-app
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
    attrs:
      order: 20
