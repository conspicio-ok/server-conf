version: 1
metadata:
  name: service - homelable
  labels:
    blueprints.goauthentik.io/description: "homelable Access"

entries:
  # Use the common - admin blueprint
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: common - admin
      required: true

  # Create homelable group
  - model: authentik_core.group
    id: homelable-grp
    state: present
    identifiers:
      name: homelable-users

  # Create a Provider
  - model: authentik_providers_oauth2.oauth2provider
    id: homelable-provider
    state: present
    identifiers:
      name: homelable Provider
    attrs:
      client_type: confidential
      grant_types:
        - authorization_code
      client_id: homelable
      redirect_uris:
        - matching_mode: strict
          url: https://blueprint.final.domain.name/api/v1/auth/oidc/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  # Create an App
  - model: authentik_core.application
    id: homelable-app
    state: present
    identifiers:
      slug: homelable
    attrs:
      name: Blueprint
      meta_icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/homelable.png
      provider: !KeyOf homelable-provider
      meta_launch_url: https://blueprint.final.domain.name
      policy_engine_mode: any
      group: Server

  # Rules : homelable-grp & admins
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf homelable-app
      group: !KeyOf homelable-grp
    attrs:
      order: 0
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf homelable-app
      group: !Find [authentik_core.group, [name, admins]]
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf homelable-app
      group: !Find [authentik_core.group, [name, "authentik Admins"]]
    attrs:
      order: 20
      
