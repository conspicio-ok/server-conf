http:
  routers:
    authentik:
      rule: "Host(`final.route.domain`)"
      entryPoints:
        - websecure
      service: authentik
      middlewares:
        - security-headers
      tls:
        certResolver: letsencrypt

  middlewares:
    authentik:
      forwardAuth:
        address: "http://<ip-authentik>:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

  services:
    authentik:
      loadBalancer:
        servers:
          - url: "http://<ip-authentik>:9000"

          
