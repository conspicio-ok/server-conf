entryPoints:
  web:
    address: ":80"
    proxyProtocol:
      trustedIPs:
        - "10.99.0.0/24"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    proxyProtocol:
      trustedIPs:
        - "10.99.0.0/24"
    transport:
      respondingTimeouts:
        readTimeout: 600s
  traefik:
    address: "127.0.0.1:8080"

ping:
  entryPoint: traefik

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: true

log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log

certificatesResolvers:
  letsencrypt:
    acme:
      email: your@email.exemple
      storage: /var/lib/traefik/acme.json
      dnsChallenge:
        provider: your-provider
        resolvers:
          - "1.1.1.1:53"
          - "9.9.9.9:53"

